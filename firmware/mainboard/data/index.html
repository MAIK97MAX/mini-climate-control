<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Climate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="temp"><span id="temp">--</span>&deg;C</div>
  <div class="hum"><span id="hum">--</span> %</div>

  <div class="mode">Mode: <span id=mode>--</span></div>
  <div class="button">
    <button onClick="setMode('off')">Off</button>
    <button onClick="setMode('cooling')">Cooling</button>
    <button onClick="setMode('heating')">Heating</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
