<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Climate</title>
  <style>
    body  { font-family: sans-serif; background: #111; color: #eee;
            text-align: center; margin-top: 60px; }
    .temp { font-size: 80px; }
    .hum  { font-size: 32px; color: #6cf; }
  </style>
</head>
<body>
  <div class="temp"><span id="t">--</span>&deg;C</div>
  <div class="hum"><span id="h">--</span> %</div>

  <script>
    async function update() {
      try {
        const r = await fetch('/data');
        const d = await r.json();
        document.getElementById('t').textContent = (d.temp === null) ? '--' : d.temp;
        document.getElementById('h').textContent = (d.hum  === null) ? '--' : d.hum;
      } catch (e) {
        // connection hiccup, try again next time
      }
    }
    update();
    setInterval(update, 2000);
  </script>
</body>
</html>
